user_agent: "Wayback Archiving"
threads: 2
archive_threads: 1
# Anonymous Save Page Now pacing. SPN2 documents 7 authenticated captures a minute.
archive_delay_seconds: 4.0
max_crawl_pages: null
max_archive_urls: null
max_redirects: 5
# Largest response body kept in memory. A larger body is cut and logged as body_capped.
max_body_bytes: 10485760
# Attempts for one URL after a timeout, network error, 5xx, or rate limit.
max_transient_attempts: 3
rearchive_window_days: 7
# A Wayback snapshot older than this many days triggers a new capture.
wayback_max_age_days: 7
retry_delays_seconds:
  - 5.0
  - 10.0
  - 20.0
max_retry_after_seconds: 300.0
request_timeout_seconds: 30.0
fallbacks:
  - curl
  - curl_cffi
  - camoufox
curl_cffi_impersonate: "chrome"
# {host} becomes the seed host, so each site gets its own catalog.
db_path: data/{host}.sqlite3
wayback_avail_url: "https://archive.org/wayback/available"
wayback_save_url: "https://web.archive.org/save/"
# Authenticated capture. It runs only when CIVIL_SERVICE_SPN_ACCESS_KEY and
# CIVIL_SERVICE_SPN_SECRET_KEY are set in the environment.
spn2_save_url: "https://web.archive.org/save"
spn2_status_url: "https://web.archive.org/save/status/"
spn2_delay_seconds: 9.0
spn2_poll_seconds: 5.0
spn2_max_polls: 12
# sitemaps.org limit: 50 MB per sitemap file.
max_sitemap_bytes: 52428800
max_sitemaps: 20
progress_refresh_seconds: 1.0
respect_robots_txt: true
include_subdomains: false
allowed_schemes:
  - http
  - https
log_level: "INFO"
